plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edge.bikeedgeracers'
    compileSdk 34

    defaultConfig {
        applicationId "com.edge.bikeedgeracers"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "7.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O3"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
